# Broker for on-prem gateways: docker compose --profile broker up (see README, "Gateways").
# The broker's start command in docker-compose.yml writes the passwd and psk files from .env.
allow_anonymous false
password_file /mosquitto/config/passwd
psk_file /mosquitto/config/psk

# The bridge, inside Docker only: MQTT_URL=mqtt://broker:1883
listener 1883

# Gateways: TLS with the pre-shared key (identity wittra-gateway), plus the login
listener 8883
psk_hint wittra-opcua
